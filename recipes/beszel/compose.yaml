# Rendered by restored before `docker compose up`. The ${RESTORED_INPUT_*} values are
# absolute paths inside the run workspace, and ${RESTORED_VAR_*} come from `vars:`.
#
# Do not add `ports:`, `privileged:`, `network_mode:`, `pid:`, `ipc:`, or a bind mount
# to any path outside the workspace. `restored recipe validate` rejects all of them.
services:
  beszel:
    image: henrygd/beszel:0.18.8
    environment:
      APP_URL: http://beszel:${RESTORED_VAR_beszel_port}
      # Documented environment variables: "Create first user with this email" and
      # "...with this password". They only do anything when there is no user yet, so a
      # restored hub keeps the account from the backup and these are ignored.
      USER_EMAIL: ${RESTORED_VAR_drill_email}
      USER_PASSWORD: ${RESTORED_VAR_drill_password}
    volumes:
      - ${RESTORED_INPUT_data}:/beszel_data
    networks: [restored]

  # Started only by `restored recipe test`, via the "test" compose profile. The beszel
  # image has no shell at all, so the seeding cannot run inside it.
  seeder:
    image: curlimages/curl:8.10.1
    profiles: [test]
    command: ["sleep", "infinity"]
    networks: [restored]

networks:
  restored:
    internal: true
