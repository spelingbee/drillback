# Rendered by drillback before `docker compose up`. The ${DRILLBACK_INPUT_*} values are
# absolute paths inside the run workspace, and ${DRILLBACK_VAR_*} come from `vars:`.
#
# Do not add `ports:`, `privileged:`, `network_mode:`, `pid:`, `ipc:`, or a bind mount
# to any path outside the workspace. `drillback recipe validate` rejects all of them.
services:
  # The image runs as uid 911 (abc). A restic restore brings back the uids of the
  # machine the backup came from; a copy through a filesystem without uids brings back
  # none. Either way Mealie cannot write to its own data directory without this.
  prepare:
    image: alpine:3.20
    command: ["sh", "-c", "chown -R 911:911 /app/data; exit 0"]
    volumes:
      - ${DRILLBACK_INPUT_data}:/app/data
    networks: [drillback]

  mealie:
    image: ghcr.io/mealie-recipes/mealie:v3.24.0
    depends_on:
      prepare:
        condition: service_completed_successfully
    environment:
      ALLOW_SIGNUP: "false"
      BASE_URL: http://mealie:${DRILLBACK_VAR_mealie_port}
    volumes:
      - ${DRILLBACK_INPUT_data}:/app/data
    networks: [drillback]

  # Started only by `drillback recipe test`, via the "test" compose profile.
  seeder:
    image: curlimages/curl:8.10.1
    profiles: [test]
    command: ["sleep", "infinity"]
    networks: [drillback]

networks:
  drillback:
    internal: true
