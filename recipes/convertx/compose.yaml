# Rendered by drillback before `docker compose up`. The ${DRILLBACK_INPUT_*} values are
# absolute paths inside the run workspace, and ${DRILLBACK_VAR_*} come from `vars:`.
#
# Do not add `ports:`, `privileged:`, `network_mode:`, `pid:`, `ipc:`, or a bind mount
# to any path outside the workspace. `drillback recipe validate` rejects all of them.
services:
  convertx:
    image: ghcr.io/c4illin/convertx:v0.18.0
    environment:
      # The README recommends setting this; unset, ConvertX uses a random UUID, which
      # means every session token is invalidated on every restart. It signs tokens and
      # encrypts nothing in the database, so a restore does not need the original - but
      # it is not in the backup either, it is in your compose file.
      - JWT_SECRET=aLongAndSecretStringUsedToSignTheJSONWebToken1234
      # The README's own warning: needed when the service is not reached over localhost
      # or https, which is every check in this stack.
      - HTTP_ALLOWED=true
    volumes:
      - ${DRILLBACK_INPUT_data}:/app/data
    networks: [drillback]

  # Started only by `drillback recipe test`, via the "test" compose profile.
  seeder:
    image: curlimages/curl:8.10.1
    profiles: [test]
    command: ["sleep", "infinity"]
    volumes:
      - ${DRILLBACK_TEST_ASSETS}:/seed:ro
    networks: [drillback]

networks:
  drillback:
    internal: true
