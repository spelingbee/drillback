# Lint, unit, integration, and the two generated files.
#
# Third-party actions are pinned by commit SHA, never by tag, because a tag is a
# mutable pointer into somebody else's repository.
#
# A pull request that touches only recipes/<name>/** does NOT need this workflow to be
# green: recipes.yml is the one that judges a recipe. See CONTRIBUTING.md.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "these files are not gofmt-clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.13.2

      - name: english only
        run: ./scripts/lint-english.sh

  # docs/recipe-spec.md comes from the JSON Schema and recipes/README.md comes from the
  # registry. Both are checked in so they are readable on GitHub, which means both can
  # go stale; this is the thing that stops them.
  generated:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: regenerate and diff
        run: |
          go run ./tools/gen recipe-spec   > docs/recipe-spec.md
          go run ./tools/gen recipes-index > recipes/README.md
          go run ./tools/gen readme-table

          # docs/recipe-spec.md is generated from schema/recipe.schema.json. If it
          # drifted, somebody changed the schema without regenerating the document
          # contributors read, and that is a hard failure for whoever did it.
          if ! git diff --exit-code -- docs/recipe-spec.md; then
            echo
            echo "docs/recipe-spec.md is out of date with schema/recipe.schema.json. Run:"
            echo "    make docs"
            exit 1
          fi

          # recipes/README.md and the table in README.md are generated from the
          # recipe registry, so they change whenever a recipe is ADDED - which is
          # precisely the pull request CONTRIBUTING.md promises needs nothing but
          # recipes.yml to be green. Gating on them here made that promise false for
          # every recipe contributor, which is the one contributor this project is
          # optimising for. refresh-registry.yml regenerates them on main after the
          # merge instead. Reported here, never gated. See ADR-060 and
          # docs/review/maintainer.md MNT-02.
          if ! git diff --exit-code -- recipes/README.md README.md; then
            echo
            echo "::notice::The recipe tables changed. main regenerates them after this merges; there is nothing for you to do."
          fi

  unit:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # The unit suite must stay green on a machine with no docker and no restic, so
      # that somebody who has just cloned the repository gets a working `go test ./...`
      # before they install anything.
      - name: go test
        run: go test ./... -race -coverprofile=coverage.out

      - name: the binary works without docker or restic
        run: |
          go build -o restored ./cmd/restored
          ./restored version
          ./restored recipe validate ./recipes/gitea ./recipes/uptime-kuma --strict
        shell: bash

  # ubuntu-latest runners have docker, so the integration suite runs for real. It
  # stands up Gitea, PostgreSQL and Uptime Kuma several times, which is most of the
  # runtime.
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: install restic
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends restic

      - name: versions
        run: |
          docker version --format '{{.Server.Version}}'
          docker compose version
          restic version

      # Pulling these once, before the suite, keeps a slow registry out of the
      # per-test budgets and makes a pull failure legible as a pull failure.
      - name: pull the images the suite uses
        run: |
          for image in \
            curlimages/curl:8.16.0 \
            gitea/gitea:1.22.6 \
            postgres:16.4-alpine \
            louislam/uptime-kuma:1.23.16-alpine \
            keinos/sqlite3:3.46.0 \
            restic/restic:0.19.1 \
            nginx:1.27-alpine
          do
            docker pull -q "$image"
          done

      - name: go test -tags integration
        run: go test -tags integration ./... -timeout 35m

      - name: nothing was left behind
        if: always()
        run: |
          leftover=$(docker ps -aq --filter "label=com.restored.run" | wc -l)
          echo "containers labelled com.restored.run: $leftover"
          test "$leftover" -eq 0
